# Exported shape of the live "gas-killer-extras" Ingress (which SURVIVED the July 21
# expiry teardown — it is not in the cron's delete list). ssl-redirect must stay
# "false": TLS terminates upstream, and without it nginx 308-loops /forkhead.
# It exposes gk-sim-proxy's /forkhead publicly so the bridge/frontend can pin task
# block heights at the sim fork's head. It exists as a STANDALONE ingress precisely
# because helm re-renders wiped /forkhead when it was patched onto the chart ingress
# (happened 3x). Shape mirrors the tracked bridge ingress; re-verify host TLS
# annotations against the chart ingress after applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gas-killer-extras
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "POST, GET, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization,Content-Type"
spec:
  ingressClassName: nginx
  rules:
    - host: testnet.gaskiller.xyz
      http:
        paths:
          - path: /forkhead
            pathType: Prefix
            backend:
              service:
                name: gk-sim-proxy
                port:
                  number: 8545
    - host: 8-228-87-183.nip.io
      http:
        paths:
          - path: /forkhead
            pathType: Prefix
            backend:
              service:
                name: gk-sim-proxy
                port:
                  number: 8545
