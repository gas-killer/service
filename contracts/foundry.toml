[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.29"
evm_version = "prague"
fs_permissions = [
    { access = "read-write", path = "./script/deployments" },
    { access = "read", path = "./test/fixtures" },
]
optimizer = true
optimizer_runs = 200
# The slashable verifyAndUpdate ABI (anchorHash + callerAddress + contractCalldata)
# exceeds the legacy codegen stack; via-IR is required to compile it.
via_ir = true
remappings = [
    "@eigenlayer-middleware/=lib/eigenlayer-middleware/src/",
    "@eigenlayer-middleware-test/=lib/eigenlayer-middleware/test/",
    "eigenlayer-contracts/=lib/eigenlayer-middleware/lib/eigenlayer-contracts/",
    "@openzeppelin-upgrades/=lib/eigenlayer-middleware/lib/openzeppelin-contracts-upgradeable/",
    "@openzeppelin/=lib/eigenlayer-middleware/lib/openzeppelin-contracts/",
    "forge-std/=lib/eigenlayer-middleware/lib/forge-std/src/",
    "ds-test/=lib/eigenlayer-middleware/lib/ds-test/src/",
]
