apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gk-shard-bridge
  name: gk-shard-bridge
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gk-shard-bridge
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-07-16T15:15:38-04:00'
      labels:
        app: gk-shard-bridge
    spec:
      containers:
      - command:
        - python
        - /app/bridge.py
        env:
        - name: GK_KEY
          valueFrom:
            secretKeyRef:
              key: GK_KEY
              name: gk-bridge-key
        - name: ROUTER_SHARD
          value: http://gas-killer-router:8081
        - name: ROUTER_API
          value: http://gas-killer-router:8080
        - name: RPC_URL
          value: https://ethereum-sepolia-rpc.publicnode.com
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        name: bridge
        ports:
        - containerPort: 8090
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /bridge/healthz
            port: 8090
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app
          name: script
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: gk-bridge-script
        name: script
---
apiVersion: v1
kind: Service
metadata:
  name: gk-shard-bridge
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 8090
    protocol: TCP
    targetPort: 8090
  selector:
    app: gk-shard-bridge
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gk-shard-bridge
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: testnet.gaskiller.xyz
    http:
      paths:
      - backend:
          service:
            name: gk-shard-bridge
            port:
              number: 8090
        path: /bridge
        pathType: Prefix
  - host: 8-228-87-183.nip.io
    http:
      paths:
      - backend:
          service:
            name: gk-shard-bridge
            port:
              number: 8090
        path: /bridge
        pathType: Prefix
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: qwen-fork-refresh
  name: qwen-fork-refresh
  namespace: default
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: {}
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      template:
        metadata: {}
        spec:
          containers:
          - args:
            - -sf
            - -m
            - '60'
            - -X
            - POST
            - -H
            - 'Content-Type: application/json'
            - -d
            - '{"jsonrpc":"2.0","id":1,"method":"anvil_reset","params":[{"forking":{"jsonRpcUrl":"https://ethereum-sepolia-rpc.publicnode.com"}}]}'
            - http://qwen-sim-fork:8547
            image: curlimages/curl:8.10.1
            imagePullPolicy: IfNotPresent
            name: refresh
            resources:
              limits:
                cpu: 100m
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 16Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  schedule: '*/8 * * * *'
  successfulJobsHistoryLimit: 2
  suspend: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-expiry
  namespace: default
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata: {}
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata: {}
        spec:
          containers:
          - args:
            - "set -x\nPROJ=gas-killer-testnet; LOC=us-east4; CLUSTER=gas-killer\n\
              API=\"https://container.googleapis.com/v1/projects/$PROJ/locations/$LOC/clusters/$CLUSTER\"\
              \ntok() { curl -s -H \"Metadata-Flavor: Google\" \\\n  \"http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token\"\
              \ \\\n  | sed -n 's/.*\"access_token\":\"\\([^\"]*\\)\".*/\\1/p'; }\n\
              # 1. demo workloads\nkubectl delete deploy qwen-sim-fork qwen-overlay-ensurer\
              \ gk-sim-proxy -n default --ignore-not-found\nkubectl delete svc qwen-sim-fork\
              \ gk-sim-proxy -n default --ignore-not-found\nkubectl delete configmap\
              \ gk-sim-proxy-src -n default --ignore-not-found\n# 2. unpin operators\
              \ so they can reschedule after the node shrink\nfor d in gas-killer-node-1\
              \ gas-killer-node-2 gas-killer-node-3 gas-killer-router; do\n  kubectl\
              \ patch deploy $d -n default --type json \\\n    -p '[{\"op\":\"remove\"\
              ,\"path\":\"/spec/template/spec/nodeSelector\"}]' || true\ndone\n# 3.\
              \ delete the sim + operators node pools, waiting out any running cluster\
              \ op\nfor POOL in sim-pool-c4 ops-highmem; do\n  for i in $(seq 1 60);\
              \ do\n    OUT=$(curl -s -X DELETE -H \"Authorization: Bearer $(tok)\"\
              \ \"$API/nodePools/$POOL\")\n    echo \"$OUT\" | grep -q '\"name\"'\
              \ && break\n    echo \"$OUT\" | grep -qi \"notFound\" && break\n   \
              \ sleep 60\n  done\ndone\n# 4. shrink default pool to 1 node (retry\
              \ until the delete op clears)\nfor i in $(seq 1 60); do\n  OUT=$(curl\
              \ -s -X POST -H \"Authorization: Bearer $(tok)\" \\\n    -H \"Content-Type:\
              \ application/json\" -d '{\"nodeCount\":1}' \\\n    \"$API/nodePools/default-pool:setSize\"\
              )\n  echo \"$OUT\" | grep -q '\"name\"' && break\n  sleep 60\ndone\n\
              # 5. one-shot: suspend this cronjob\nkubectl patch cronjob demo-expiry\
              \ -n default -p '{\"spec\":{\"suspend\":true}}'\necho \"EXPIRY COMPLETE\"\
              \n"
            command:
            - /bin/bash
            - -c
            image: bitnami/kubectl:latest
            imagePullPolicy: Always
            name: expire
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: demo-expiry
          serviceAccountName: demo-expiry
          terminationGracePeriodSeconds: 30
  schedule: 30 20 25 7 *
  successfulJobsHistoryLimit: 3
  suspend: true
  timeZone: Etc/UTC
