services:
  ethereum:
    platform: linux/amd64
    image: ghcr.io/breadchaincoop/ethereum:latest
    env_file:
      - .env
    ports:
      - "8545:8545"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        anvil --fork-url $FORK_URL --host 0.0.0.0 --port 8545 --code-size-limit 65536 \
          --timeout 120000 \
          --retries 5 \
          --compute-units-per-second 300

  eigenlayer:
    platform: linux/amd64
    # The setup image also deploys the Gas Killer ECDSA stack (ECDSAStakeRegistry +
    # GasKillerServiceManager) and registers the operators with it. Override to pin
    # a specific build (e.g. a pr- tag) or a locally built image.
    image: ${EIGENLAYER_IMAGE:-ghcr.io/breadchaincoop/eigenlayer:latest}
    depends_on:
      ethereum:
        condition: service_started
    env_file:
      - .env
    environment:
      - RPC_URL=http://ethereum:8545
    volumes:
      - ./config/.nodes:/root/.nodes
      - ./config/config.example.json:/bls-middleware/contracts/docker/eigenlayer/config.json

  signer:
    image: ghcr.io/layr-labs/cerberus:0.0.2
    platform: linux/amd64
    depends_on:
      eigenlayer:
        condition: service_completed_successfully
    ports:
      - "${CERBERUS_METRICS_PORT:-9081}:${CERBERUS_METRICS_PORT:-9081}"
      - "${CERBERUS_GRPC_PORT:-50051}:${CERBERUS_GRPC_PORT:-50051}"
    environment:
      - "METRICS_PORT=${CERBERUS_METRICS_PORT:-9081}"
    env_file:
      - .env
    restart: unless-stopped

  # Prepares the engine-journal volumes: fresh named volumes are root-owned,
  # while the node/router images run as appuser (uid 1000). Chown once here so
  # the aggregation engine can create its journal under STORAGE_DIR.
  storage-init:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - node-1-data:/data/node-1
      - node-2-data:/data/node-2
      - node-3-data:/data/node-3
      - router-data:/data/router
    command: chown -R 1000:1000 /data/node-1 /data/node-2 /data/node-3 /data/router
    restart: "no"

  node-1:
    build:
      context: .
      dockerfile: node/Dockerfile
    platform: linux/amd64
    depends_on:
      eigenlayer:
        condition: service_completed_successfully
      ethereum:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - HTTP_RPC=http://ethereum:8545
      - WS_RPC=ws://ethereum:8545
      - AVS_DEPLOYMENT_PATH=/app/.nodes/avs_deploy.json
      - STORAGE_DIR=/app/data
    volumes:
      - ./config/.nodes/operator_keys/testacc1.private.ecdsa.key.json:/app/key.json:ro
      - ./config/.nodes:/app/.nodes:ro
      - ./config/public_orchestrator.dev.json:/app/public_orchestrator.json:ro
      - node-1-data:/app/data
    command:
      [
        "--key-file",
        "/app/key.json",
        "--port",
        "3001",
        "--orchestrator",
        "/app/public_orchestrator.json",
      ]
    ports:
      - "4001:3001"
      - "9001:8081"  # metrics / healthz
    restart: unless-stopped

  node-2:
    build:
      context: .
      dockerfile: node/Dockerfile
    platform: linux/amd64
    depends_on:
      eigenlayer:
        condition: service_completed_successfully
      ethereum:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - HTTP_RPC=http://ethereum:8545
      - WS_RPC=ws://ethereum:8545
      - AVS_DEPLOYMENT_PATH=/app/.nodes/avs_deploy.json
      - STORAGE_DIR=/app/data
    volumes:
      - ./config/.nodes/operator_keys/testacc2.private.ecdsa.key.json:/app/key.json:ro
      - ./config/.nodes:/app/.nodes:ro
      - ./config/public_orchestrator.dev.json:/app/public_orchestrator.json:ro
      - node-2-data:/app/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 15 && exec gas-killer-node --key-file /app/key.json --port 3002 --orchestrator /app/public_orchestrator.json"
    ports:
      - "4002:3002"
      - "9002:8081"  # metrics / healthz
    restart: unless-stopped

  node-3:
    build:
      context: .
      dockerfile: node/Dockerfile
    platform: linux/amd64
    depends_on:
      eigenlayer:
        condition: service_completed_successfully
      ethereum:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - HTTP_RPC=http://ethereum:8545
      - WS_RPC=ws://ethereum:8545
      - AVS_DEPLOYMENT_PATH=/app/.nodes/avs_deploy.json
      - STORAGE_DIR=/app/data
    volumes:
      - ./config/.nodes/operator_keys/testacc3.private.ecdsa.key.json:/app/key.json:ro
      - ./config/.nodes:/app/.nodes:ro
      - ./config/public_orchestrator.dev.json:/app/public_orchestrator.json:ro
      - node-3-data:/app/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 30 && exec gas-killer-node --key-file /app/key.json --port 3003 --orchestrator /app/public_orchestrator.json"
    ports:
      - "4003:3003"
      - "9003:8081"  # metrics / healthz
    restart: unless-stopped

  router:
    build:
      context: .
      dockerfile: router/Dockerfile
    platform: linux/amd64
    depends_on:
      eigenlayer:
        condition: service_completed_successfully
      ethereum:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
      node-1:
        condition: service_started
      node-2:
        condition: service_started
      node-3:
        condition: service_started
    env_file:
      - .env
    environment:
      - HTTP_RPC=http://ethereum:8545
      - WS_RPC=ws://ethereum:8545
      - AVS_DEPLOYMENT_PATH=/app/.nodes/avs_deploy.json
      # Aggregation-engine journal directory (write-ahead log of acks/certificates).
      - STORAGE_DIR=/app/data
      # SQLite API-key store path (shares the router-data volume with the journal).
      - DATA_DIR=/app/data
      # Guards the /admin/keys endpoints used to mint the API keys that authenticate /trigger.
      # Defaults to a fixed value for the local/e2e harness; override by exporting ADMIN_KEY.
      - ADMIN_KEY=${ADMIN_KEY:-ci-admin-key}
    volumes:
      - ./config/.nodes:/app/.nodes:ro
      - ./config/router_orchestrator.dev.json:/app/router_orchestrator.json:ro
      - router-data:/app/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 45 && exec gas-killer-router --key-file /app/router_orchestrator.json --port 3000"
    ports:
      - "4000:3000"
      - "${ROUTER_INGRESS_PORT:-8080}:8080"
      - "8081:8081"  # metrics / healthz
    restart: unless-stopped

# Writable storage for the aggregation engine's journal (STORAGE_DIR). Named
# volumes so certificates/acks survive container restarts; `docker compose
# down -v` wipes them, which is also the manual recovery path for a height
# wedged by split real/skip digests (see README "Failure modes and recovery").
volumes:
  node-1-data:
  node-2-data:
  node-3-data:
  router-data:
