[package]
name = "gas-killer-common"
version.workspace = true
edition.workspace = true

[dependencies]
# Ethereum / Alloy (for bindings)
alloy = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }

# Serialization
anyhow = { workspace = true }

# Async
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }

# Commonware
commonware-avs-bindings = { workspace = true }
commonware-avs-core = { workspace = true }
commonware-avs-eigenlayer = { workspace = true }
commonware-codec = { workspace = true }
commonware-consensus = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-runtime = { workspace = true }
commonware-utils = { workspace = true }

# Config
dotenv = { workspace = true }

# Gas analysis
gas-analyzer = { workspace = true }
gas-analyzer-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Logging
tracing = { workspace = true }
url = { workspace = true }

# Schnorr / MuSig2 signatures
k256 = { version = "0.13", features = ["arithmetic"] }

[dev-dependencies]
rand = { workspace = true }
