[package]
name = "gas-killer-common"
version.workspace = true
edition.workspace = true

[dependencies]
# Ethereum / Alloy (for bindings)
alloy = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }

# Serialization
anyhow = { workspace = true }

# Async
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }

# Cryptography / EigenLayer operator discovery
eigen-client-avsregistry = { workspace = true }
eigen-common = { workspace = true }
eigen-logging = { workspace = true }
eigen-services-operatorsinfo = { workspace = true }
eigen-utils = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
thiserror = "2"

# secp256k1 curve arithmetic for aggregate Schnorr (same version alloy-signer pins,
# so no duplicate in the tree). Point add/sub + scalar ops for MuSig2 aggregation.
k256 = { version = "0.13", features = ["arithmetic"] }

# Commonware
commonware-codec = { workspace = true }
commonware-consensus = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-math = { workspace = true }
commonware-parallel = { workspace = true }
commonware-runtime = { workspace = true }
commonware-utils = { workspace = true }

# Config
dotenv = { workspace = true }

# Gas analysis
gas-analyzer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Logging
tracing = { workspace = true }
url = { workspace = true }
