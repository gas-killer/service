name: E2E Test

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: |
          cp example.env .env
          if grep -q '^FORK_URL=' .env; then
            sed -i "s|^FORK_URL=.*|FORK_URL=${{ secrets.HTTP_RPC }}|" .env
          else
            echo "FORK_URL=${{ secrets.HTTP_RPC }}" >> .env
          fi

      - name: Run test
        run: bash ./scripts/run_e2e_test.sh 2>&1 | tee e2e-test-output.log; exit ${PIPESTATUS[0]}

      - name: Show router logs
        if: always()
        run: |
          echo "=== Router Logs ==="
          docker compose logs router || true

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-output
          path: e2e-test-output.log
          retention-days: 1

  e2e-test-unbounded:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: |
          cp example.env .env
          if grep -q '^FORK_URL=' .env; then
            sed -i "s|^FORK_URL=.*|FORK_URL=${{ secrets.HTTP_RPC }}|" .env
          else
            echo "FORK_URL=${{ secrets.HTTP_RPC }}" >> .env
          fi

      # Same stack, but the ArraySummation array is sized so a direct sum() exceeds
      # the mainnet block gas limit; the pipeline must land it via one small
      # verifyAndUpdate (SimProfile::UnboundedV1 on router+nodes, anvil without a
      # block gas limit). Assertions live in run_e2e_test.sh steps 7a/10b.
      - name: Run test
        run: bash ./scripts/run_unbounded_e2e_test.sh 2>&1 | tee e2e-test-output.log; exit ${PIPESTATUS[0]}

      - name: Show router logs
        if: always()
        run: |
          echo "=== Router Logs ==="
          docker compose logs router || true

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-unbounded-output
          path: e2e-test-output.log
          retention-days: 1

  e2e-test-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: |
          cp example.env .env
          if grep -q '^FORK_URL=' .env; then
            sed -i "s|^FORK_URL=.*|FORK_URL=${{ secrets.HTTP_RPC }}|" .env
          else
            echo "FORK_URL=${{ secrets.HTTP_RPC }}" >> .env
          fi

      # Same stack, but the consumer is the solidity-sdk on-chain LLM
      # (GasKillerLLM, stories260K — a full Llama-2 transformer in Solidity):
      # real operators simulate tellStory() under UnboundedV1 (~1.4B gas, ~47x a
      # mainnet block), the quorum signs the single-STORE + StoryTold diff, and
      # the harness decodes the story text from the applied verifyAndUpdate
      # receipt and asserts the reference generation. Assertions live in
      # run_e2e_test.sh steps 7a/10b/10c.
      - name: Run test
        run: bash ./scripts/run_llm_e2e_test.sh 2>&1 | tee e2e-test-output.log; exit ${PIPESTATUS[0]}

      - name: Show router logs
        if: always()
        run: |
          echo "=== Router Logs ==="
          docker compose logs router || true

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-llm-output
          path: e2e-test-output.log
          retention-days: 1
