name: E2E Test

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    branches:
      - main
      - dev
      - staging
      # Stacked-PR chain for the Schnorr work: this branch is the base of the
      # Schnorr PR, so PRs targeting it (i.e. the Schnorr PR itself) must run the
      # full e2e matrix — otherwise the live aggregate-signing path is never
      # demonstrated as a gating check. Remove once the stack lands on a mainline
      # branch.
      - RonTuretzky/pr299-ecdsa-signatures
      - RonTuretzky/schnorr-aggregate-signatures
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # Explicit combinations (include-only, so each entry is its own job — a bare
        # `include` added to a base axis would MERGE into the matching base combination
        # instead of creating a separate leg):
        #   - the engine-driven ECDSA path (legacy encoding, array-summation example)
        #   - the interactive aggregate-Schnorr path (legacy encoding, array-summation)
        #   - the aggregate-Schnorr path under the CANONICAL encoding settling a task that
        #     makes a re-entrant external call mid-transition — a green run proves
        #     re-entrancy settles safely end-to-end.
        include:
          - signature_scheme: ecdsa
            state_encoding: legacy
            e2e_example: array-summation
          - signature_scheme: schnorr
            state_encoding: legacy
            e2e_example: array-summation
          - signature_scheme: schnorr
            state_encoding: canonical
            e2e_example: reentrant

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: |
          cp example.env .env
          if grep -q '^FORK_URL=' .env; then
            sed -i "s|^FORK_URL=.*|FORK_URL=${{ secrets.HTTP_RPC }}|" .env
          else
            echo "FORK_URL=${{ secrets.HTTP_RPC }}" >> .env
          fi

      - name: Run test
        env:
          # The ECDSA AVS stack is deployed by the eigenlayer setup image. Pinned to
          # the companion PR build of BreadchainCoop/eigenlayer-bls-local; repin to
          # "latest" once that PR merges. (The schnorr stack additionally deploys
          # SchnorrStakeRegistry from this repo's deploy binary — same setup image.)
          EIGENLAYER_IMAGE: ghcr.io/breadchaincoop/eigenlayer:pr-ron-gas-killer-ecdsa-stack
          SIGNATURE_SCHEME: ${{ matrix.signature_scheme }}
          STATE_ENCODING: ${{ matrix.state_encoding }}
          E2E_EXAMPLE: ${{ matrix.e2e_example }}
        run: bash ./scripts/run_e2e_test.sh 2>&1 | tee e2e-test-output.log; exit ${PIPESTATUS[0]}

      - name: Show router logs
        if: always()
        run: |
          echo "=== Router Logs ==="
          docker compose logs router || true

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-output-${{ matrix.signature_scheme }}-${{ matrix.e2e_example }}
          path: e2e-test-output.log
          retention-days: 1
