name: Helm Integration Test

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:

jobs:
  # Renders every supported chart configuration. The kind job below installs exactly one of
  # them (LOCAL), so without this the render-time guards — the simRpc/simFork exclusion, the
  # sim-node restore guard — and both non-LOCAL simulation paths have no coverage at all.
  helm-render:
    name: Lint and render every chart configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Enough to satisfy the chart's required-value guards; none of it is reachable.
      COMMON: >-
        --set secrets.httpRpc=https://rpc.invalid
        --set secrets.privateKey=0x01
        --set secrets.fundedKey=0x02
        --set secrets.adminKey=ci-admin-key
        --set orchestrator.routerPrivateKey=0x03
        --set secretManager.enabled=false
        --set monitoring.enabled=false
        --set router.image.tag=router-ci
        --set node.image.tag=node-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Fetch Helm dependencies
        # build, not update: render against the versions Chart.lock pins rather than
        # re-resolving them, so a subchart release upstream cannot change what CI checked.
        # build reads the lock, which needs the repos it names to be registered first.
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build ./helm/gas-killer

      - name: Lint
        run: |
          helm lint ./helm/gas-killer
          helm lint ./helm/sim-node

      - name: Render sim-node
        run: |
          helm template sim-node ./helm/sim-node > /dev/null
          helm template sim-node ./helm/sim-node \
            --set replicas=0 --set snapshot.restore.enabled=true > /dev/null

      - name: Reject a snapshot restore that would race the node
        run: |
          # The Job wipes the datadir, so it must not render while the StatefulSet is writing.
          if helm template sim-node ./helm/sim-node --set snapshot.restore.enabled=true \
               > /dev/null 2>&1; then
            echo "restoring at replicas=1 rendered; the guard is gone" >&2
            exit 1
          fi

      - name: Render LOCAL
        run: |
          helm template gk ./helm/gas-killer -f helm/gas-killer/local-overrides.yaml \
            --set secrets.forkUrl=https://rpc.invalid \
            --set secrets.privateKey=0x01 --set secrets.fundedKey=0x02 \
            --set monitoring.enabled=false \
            --set router.image.tag=router-ci --set node.image.tag=node-ci > "$RUNNER_TEMP/local.yaml"
          # LOCAL anvil is the chain, so nothing may point the fleet at a simulation endpoint.
          if grep -q 'name: SIM_HTTP_RPC' "$RUNNER_TEMP/local.yaml"; then
            echo "LOCAL grew a simulation endpoint" >&2
            exit 1
          fi
          echo "LOCAL renders with no sim endpoint"
          # Setup retries are free against anvil.
          SETUP='select(.kind == "Job" and .metadata.name == "gk-gas-killer-setup")'
          test "$(yq "$SETUP | .spec.backoffLimit" "$RUNNER_TEMP/local.yaml")" = 3
          test "$(yq "$SETUP | .spec.template.spec.restartPolicy" "$RUNNER_TEMP/local.yaml")" = OnFailure

      - name: Render TESTNET against the in-cluster node
        run: |
          helm template gk ./helm/gas-killer -f helm/gas-killer/testnet-overrides.yaml \
            $COMMON > "$RUNNER_TEMP/node.yaml"
          # The digest depends on every operator simulating against the same endpoint under the
          # same profile, so the router and all three nodes must agree on both.
          test "$(grep -A1 'name: SIM_HTTP_RPC' "$RUNNER_TEMP/node.yaml" | grep -c 'http://sim-node:8545')" = 4
          test "$(grep -A1 'name: GK_SIM_PROFILE' "$RUNNER_TEMP/node.yaml" | grep -c 'unbounded')" = 4
          echo "router and nodes agree on endpoint and profile"
          # Each setup attempt deploys a fresh AVS on a live network, so a failure must stop at
          # one: backoffLimit alone still lets the kubelet restart the container in place.
          SETUP='select(.kind == "Job" and .metadata.name == "gk-gas-killer-setup")'
          test "$(yq "$SETUP | .spec.backoffLimit" "$RUNNER_TEMP/node.yaml")" = 0
          test "$(yq "$SETUP | .spec.template.spec.restartPolicy" "$RUNNER_TEMP/node.yaml")" = Never
          echo "setup runs once on testnet"

      - name: Render TESTNET against the bundled fork
        run: |
          helm template gk ./helm/gas-killer -f helm/gas-killer/testnet-overrides.yaml \
            $COMMON \
            --set secrets.forkUrl=https://rpc.invalid \
            --set simRpc.url= --set l1.simFork.enabled=true \
            --set-string l1.extraArgs="--disable-block-gas-limit" > "$RUNNER_TEMP/fork.yaml"
          test "$(grep -A1 'name: SIM_HTTP_RPC' "$RUNNER_TEMP/fork.yaml" | grep -c 'gk-gas-killer-l1')" = 4
          # The l1 Service has to reach the proxy, or the fork never follows the task's block.
          grep -q 'targetPort: sim' "$RUNNER_TEMP/fork.yaml"
          echo "fork path renders behind the re-fork proxy"

      - name: Reject two simulation endpoints at once
        run: |
          # Two endpoints would fork the quorum's digests, so this must fail at render time.
          if helm template gk ./helm/gas-killer -f helm/gas-killer/testnet-overrides.yaml \
               $COMMON \
               --set secrets.forkUrl=https://rpc.invalid \
               --set l1.simFork.enabled=true \
               --set-string l1.extraArgs="--disable-block-gas-limit" > /dev/null 2>&1; then
            echo "simRpc.url and l1.simFork.enabled both rendered; the guard is gone" >&2
            exit 1
          fi

      - name: Reject a sim fork with nothing to fork
        run: |
          # Without forkUrl no fork renders, and the fleet would simulate against HTTP_RPC unbounded.
          if helm template gk ./helm/gas-killer -f helm/gas-killer/testnet-overrides.yaml \
               $COMMON \
               --set simRpc.url= --set l1.simFork.enabled=true \
               --set-string l1.extraArgs="--disable-block-gas-limit" > /dev/null 2>&1; then
            echo "l1.simFork.enabled rendered without secrets.forkUrl; the guard is gone" >&2
            exit 1
          fi

  helm-test:
    name: Test with Helm Charts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_ADMIN_KEY: ci-admin-key
      # Read by deploy_example and setup_schnorr_operators.
      SIGNATURE_SCHEME: schnorr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: gas-killer-test
          wait: 120s
          node_image: kindest/node:v1.27.3

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Build test scripts early to avoid delays after router starts
      # The router has a 180s internal timeout, so we need to minimize time between
      # router startup and triggering tasks
      - name: Build test scripts
        run: |
          cargo build --release -p scripts --bin setup_schnorr_operators
          cargo build --release -p scripts --bin deploy_example
          cargo build --release -p scripts --bin send_request

      - name: Build Docker images
        run: |
          echo "Building router image..."
          docker build -f ./router/Dockerfile -t service:router-local .

          echo "Building node image..."
          docker build -f ./node/Dockerfile -t service:node-local .

      - name: Load images into kind cluster
        run: |
          echo "Loading router image into kind..."
          kind load docker-image service:router-local --name gas-killer-test

          echo "Loading node image into kind..."
          kind load docker-image service:node-local --name gas-killer-test

      - name: Pre-pull external images into kind
        run: |
          IMAGES=(
            "ghcr.io/breadchaincoop/ethereum:latest"
            "ghcr.io/breadchaincoop/eigenlayer:$(yq '.eigenlayer.image.tag' helm/gas-killer/values.yaml)"
          )
          for IMAGE in "${IMAGES[@]}"; do
            echo "Pulling $IMAGE..."
            docker pull "$IMAGE"
            echo "Loading $IMAGE into kind..."
            kind load docker-image "$IMAGE" --name gas-killer-test
          done

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -A

      - name: Fetch Helm dependencies
        # build, not update: Chart.yaml floats every subchart (alloy "1.x.x"), so update
        # re-resolves to whatever is newest and the cluster under test stops matching
        # Chart.lock. build installs the locked versions, which needs their repos registered.
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build ./helm/gas-killer

      - name: Install Helm chart
        run: |
          # Set L1 fork URL from secret or use public Sepolia
          if [ -n "${{ secrets.HTTP_RPC }}" ]; then
            FORK_URL="${{ secrets.HTTP_RPC }}"
          else
            FORK_URL="https://ethereum-sepolia-rpc.publicnode.com"
          fi

          # Use Anvil default keys for testing
          PRIVATE_KEY="0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          FUNDED_KEY="0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

          # Sepolia EigenLayer contract addresses (matches the Sepolia fork URL above)
          DELEGATION_MANAGER="0xD4A7E1Bd8015057293f0D0A557088c286942e84b"
          STRATEGY_MANAGER="0x2E3D6c0744b10eb0A4e6F679F71554a39Ec47a5D"
          LST_CONTRACT="0x00c71b0fcadE911B2feeE9912De4Fe19eB04ca56"
          LST_STRATEGY="0x8b29d91e67b013e855EaFe0ad704aC4Ab086a574"
          ALLOCATION_MANAGER="0x42583067658071247ec8CE0A516A58f682002d07"

          echo "Installing Helm chart with fork URL: $FORK_URL"

          # Install without --wait to avoid circular dependency
          # (pods wait for setup job, setup job is post-install hook)
          helm install gas-killer ./helm/gas-killer \
            --set global.environment=LOCAL \
            --set global.nodeCount=3 \
            --set eigenlayer.contracts.delegationManager="$DELEGATION_MANAGER" \
            --set eigenlayer.contracts.strategyManager="$STRATEGY_MANAGER" \
            --set eigenlayer.contracts.lstContract="$LST_CONTRACT" \
            --set eigenlayer.contracts.lstStrategy="$LST_STRATEGY" \
            --set eigenlayer.contracts.allocationManager="$ALLOCATION_MANAGER" \
            --set secrets.forkUrl="$FORK_URL" \
            --set secrets.privateKey="$PRIVATE_KEY" \
            --set secrets.fundedKey="$FUNDED_KEY" \
            --set secrets.adminKey="$CI_ADMIN_KEY" \
            --set node.image.repository=service \
            --set node.image.tag=node-local \
            --set node.image.pullPolicy=Never \
            --set router.image.repository=service \
            --set router.image.tag=router-local \
            --set router.image.pullPolicy=Never \
            --set sharedData.storageClass=""

      - name: Check deployment status
        run: |
          echo "=== Helm Release Status ==="
          helm status gas-killer

          echo "=== All Pods ==="
          kubectl get pods -o wide

          echo "=== All Services ==="
          kubectl get services

      - name: Wait for setup job to complete
        run: |
          echo "Waiting for setup job to complete..."

          # Find the actual setup job name (includes chart name)
          SETUP_JOB=$(kubectl get jobs -o name | grep setup | head -1)

          if [ -z "$SETUP_JOB" ]; then
            echo "Setup job not found!"
            kubectl get jobs
            exit 1
          fi

          echo "Found setup job: $SETUP_JOB"
          kubectl wait --for=condition=complete "$SETUP_JOB" --timeout=900s

          echo "Setup job completed successfully"
          kubectl logs "$SETUP_JOB" --tail=30

      - name: Wait for schnorr operator-set job to complete
        run: |
          echo "Waiting for the schnorr operator-set job..."

          SCHNORR_JOB=$(kubectl get jobs -o name | grep schnorr-operators | head -1)

          if [ -z "$SCHNORR_JOB" ]; then
            echo "schnorr-operators job not found; every install renders it"
            kubectl get jobs
            exit 1
          fi

          echo "Found schnorr job: $SCHNORR_JOB"
          kubectl wait --for=condition=complete "$SCHNORR_JOB" --timeout=900s || {
            echo "schnorr-operators job failed or timed out"
            kubectl logs "$SCHNORR_JOB" --tail=100 || true
            exit 1
          }

          echo "Operator set registered"
          kubectl logs "$SCHNORR_JOB" --tail=30

      - name: Wait for all pods to be ready
        run: |
          echo "Waiting for L1 pod..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=l1 --timeout=180s

          echo "Waiting for node pods..."
          # Show pod status before waiting
          echo "=== Current pod status ==="
          kubectl get pods -o wide

          # Try waiting, but if it fails, show debug info
          if ! kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=node --timeout=300s; then
            echo "=== Node pods failed to become ready ==="
            kubectl get pods -o wide
            echo "=== Node-1 describe ==="
            kubectl describe pod -l gas-killer/node-index=1 || true
            echo "=== Node-1 logs ==="
            NODE1_POD=$(kubectl get pods -l gas-killer/node-index=1 -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            if [ -n "$NODE1_POD" ]; then
              echo "Init container wait-for-setup:"
              kubectl logs $NODE1_POD -c wait-for-setup || true
              echo "Init container wait-for-l1:"
              kubectl logs $NODE1_POD -c wait-for-l1 || true
              echo "Main container node:"
              kubectl logs $NODE1_POD -c node || true
            fi
            exit 1
          fi

          echo "Waiting for router pod..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=router --timeout=300s

          echo "All pods are ready!"

      - name: Verify router persistence
        run: |
          # The router opens its SQLite store under DATA_DIR (/data) at startup and aborts if
          # the volume is missing or not writable by the non-root user. Assert the database
          # file exists so a persistence regression surfaces here instead of as a generic
          # readiness timeout or a downstream task failure.
          ROUTER_POD=$(kubectl get pods -l app.kubernetes.io/component=router -o jsonpath='{.items[0].metadata.name}')
          echo "Router pod: $ROUTER_POD"
          echo "=== Contents of /data ==="
          kubectl exec "$ROUTER_POD" -- ls -l /data
          echo "=== Asserting /data/router.db exists ==="
          kubectl exec "$ROUTER_POD" -- test -f /data/router.db
          echo "router.db is present and the persistent volume is writable"

      - name: Setup port forwarding for testing
        run: |
          # Find actual service names (they include the chart name)
          L1_SERVICE=$(kubectl get services -o name | grep '\-l1$' | head -1 | sed 's|service/||')
          ROUTER_SERVICE=$(kubectl get services -o name | grep router | head -1 | sed 's|service/||')

          echo "L1 service: $L1_SERVICE"
          echo "Router service: $ROUTER_SERVICE"

          # Port forward L1 RPC
          kubectl port-forward service/$L1_SERVICE 8545:8545 &

          # Port forward router ingress
          kubectl port-forward service/$ROUTER_SERVICE 8080:8080 &

          # Wait for port forwards to be ready
          sleep 10

          echo "Port forwarding established"

      - name: Verify API key admin flow
        run: |
          # Exercises the full API-key lifecycle against the deployed router and its persistent
          # SQLite store: admin auth is enforced, a key is minted and listed (never leaking the
          # secret), and revocation is enforced immediately on the task path. Runs before the
          # on-chain trigger and does not disturb it — the revoked/invalid keys never enqueue a
          # task (auth is rejected before validation).
          set -euo pipefail
          ROUTER_URL=http://localhost:8080

          # A well-formed task body so POST /tasks reaches the handler's auth check rather than
          # failing JSON extraction first; field values are irrelevant because auth is evaluated
          # before validation.
          TASK_BODY='{"body":{"target_address":"0x0000000000000000000000000000000000000001","call_data":[171,205,239,1],"transition_index":0,"from_address":"0x0000000000000000000000000000000000000002","value":"0","block_height":1}}'

          echo "=== Admin endpoints reject requests without a credential ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$ROUTER_URL/admin/keys")
          [ "$CODE" = "401" ] || { echo "expected 401 without admin credential, got $CODE"; exit 1; }

          echo "=== Mint an API key ==="
          CREATE=$(curl -s -X POST -H "Authorization: Bearer $CI_ADMIN_KEY" \
            -H "Content-Type: application/json" -d '{"label":"ci-e2e"}' "$ROUTER_URL/admin/keys")
          echo "create response: $CREATE"
          KEY=$(echo "$CREATE" | jq -r '.key')
          ID=$(echo "$CREATE" | jq -r '.id')
          case "$KEY" in gk_*) ;; *) echo "minted key missing gk_ prefix: $KEY"; exit 1;; esac

          echo "=== Listing shows the key id but never the secret ==="
          LIST=$(curl -s -H "Authorization: Bearer $CI_ADMIN_KEY" "$ROUTER_URL/admin/keys")
          echo "list response: $LIST"
          echo "$LIST" | jq -e --arg id "$ID" 'any(.[]; .id == $id)' >/dev/null \
            || { echo "created key not listed"; exit 1; }
          if echo "$LIST" | jq -e 'any(.[]; has("key"))' >/dev/null; then
            echo "listing leaked the key value"; exit 1
          fi

          echo "=== The minted key passes the POST /tasks auth gate ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d "$TASK_BODY" "$ROUTER_URL/tasks")
          [ "$CODE" != "401" ] || { echo "a valid key was rejected on POST /tasks"; exit 1; }

          echo "=== Revoke the key ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $CI_ADMIN_KEY" "$ROUTER_URL/admin/keys/$ID")
          [ "$CODE" = "204" ] || { echo "expected 204 on revoke, got $CODE"; exit 1; }

          echo "=== The revoked key is rejected on POST /tasks ==="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d "$TASK_BODY" "$ROUTER_URL/tasks")
          [ "$CODE" = "401" ] || { echo "revoked key still accepted on POST /tasks (got $CODE)"; exit 1; }

          echo "API key admin flow verified"

          # Mint a working key for the remaining e2e steps, which authenticate POST /tasks with it.
          # The value is written to GITHUB_ENV (not echoed) so later steps pick it up.
          WORKING=$(curl -s -X POST -H "Authorization: Bearer $CI_ADMIN_KEY" \
            -H "Content-Type: application/json" -d '{"label":"ci-e2e-runner"}' "$ROUTER_URL/admin/keys")
          WORKING_KEY=$(echo "$WORKING" | jq -r '.key')
          case "$WORKING_KEY" in gk_*) ;; *) echo "failed to mint working key"; exit 1;; esac
          echo "GAS_KILLER_API_KEY=$WORKING_KEY" >> "$GITHUB_ENV"
          echo "provisioned working API key for downstream steps"

      - name: Verify shared data was created
        run: |
          echo "Checking if setup job created the required files..."

          # Get the setup job pod name
          SETUP_POD=$(kubectl get pods -l app.kubernetes.io/component=setup -o jsonpath='{.items[0].metadata.name}')

          echo "Setup pod: $SETUP_POD"

          # Check PVC
          kubectl get pvc

          echo "Setup job logs:"
          kubectl logs $SETUP_POD || true

      - name: Get AVS deployment file
        run: |
          echo "Copying avs_deploy.json from router pod..."

          ROUTER_POD=$(kubectl get pods -l app.kubernetes.io/component=router -o jsonpath='{.items[0].metadata.name}')

          mkdir -p config/.nodes
          kubectl cp $ROUTER_POD:/app/.nodes/avs_deploy.json ./config/.nodes/avs_deploy.json

          if [ ! -f "./config/.nodes/avs_deploy.json" ]; then
            echo "AVS deployment file not found"
            exit 1
          fi

          echo "AVS deployment file contents:"
          cat ./config/.nodes/avs_deploy.json

          # setup_schnorr_operators verifies the operator set against the registry, which needs
          # the operator key files from the PVC.
          echo "Copying operator key files..."
          kubectl cp "$ROUTER_POD:/app/.nodes/operator_keys" ./config/.nodes/operator_keys
          ls ./config/.nodes/operator_keys/*.private.ecdsa.key.json >/dev/null 2>&1 || {
            echo "Operator key files not found on the shared PVC"; exit 1; }

      - name: Deploy ArraySummation contract
        run: |
          echo "Deploying ArraySummation contract..."

          export HTTP_RPC=http://localhost:8545
          export WS_RPC=ws://localhost:8545
          export AVS_DEPLOYMENT_PATH="./config/.nodes/avs_deploy.json"
          export PRIVATE_KEY="0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

          # The array sizing lives in scripts/examples/examples.toml as constructor arguments,
          # and the target is a plain CREATE deploy from a locally built artifact.
          ./scripts/examples/fetch_examples.sh

          # The chart's schnorr-operators job already deployed the registry and registered the
          # operator set in-cluster. Pointing the binary at that address makes this a
          # verification pass rather than a second deployment: with the address set it checks
          # the registry has code and submits no registrations. Leaving it unset would deploy a
          # rival registry and leave the chart's job untested.
          SCHNORR_STAKE_REGISTRY_ADDRESS=$(jq -r '.addresses.schnorrStakeRegistry // empty' \
            ./config/.nodes/avs_deploy.json)
          if [ -z "$SCHNORR_STAKE_REGISTRY_ADDRESS" ]; then
            echo "schnorrStakeRegistry missing from avs_deploy.json; the chart's schnorr-operators job did not run"
            kubectl logs -l app.kubernetes.io/component=schnorr-operators --tail 100 || true
            exit 1
          fi
          export SCHNORR_STAKE_REGISTRY_ADDRESS
          echo "Reusing the registry the chart deployed: $SCHNORR_STAKE_REGISTRY_ADDRESS"

          # Verifies the operator set before any target deploys.
          ./target/release/setup_schnorr_operators
          ./target/release/deploy_example --example arraySummation

          echo "ArraySummation deployment completed"

      - name: Trigger Gas Killer multiple times and verify execution
        run: |
          echo "Triggering Gas Killer tasks..."

          export HTTP_RPC=http://localhost:8545
          export WS_RPC=ws://localhost:8545
          export AVS_DEPLOYMENT_PATH="./config/.nodes/avs_deploy.json"
          export GAS_KILLER_TASKS_URL=http://localhost:8080/tasks
          export PRIVATE_KEY="0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          # send_request authenticates POST /tasks with GAS_KILLER_API_KEY, minted in the admin-flow
          # step and exported via GITHUB_ENV.

          # Get the deployed target's address. deploy_example records whichever example it
          # deployed under `gasKillerTarget`, so this one lookup works for every example.
          ARRAY_SUMMATION_ADDRESS=$(jq -r '.addresses.gasKillerTarget // empty' "$AVS_DEPLOYMENT_PATH")
          if [ -z "$ARRAY_SUMMATION_ADDRESS" ]; then
            echo "❌ no deployed target address in $AVS_DEPLOYMENT_PATH"
            exit 1
          fi
          echo "Target address: $ARRAY_SUMMATION_ADDRESS"

          # Get initial stateTransitionCount
          INITIAL_COUNT=$(cast call "$ARRAY_SUMMATION_ADDRESS" "stateTransitionCount()(uint256)" --rpc-url http://localhost:8545 | tr -d '[:space:]')
          echo "Initial stateTransitionCount: $INITIAL_COUNT"

          # Block height before triggering, used to bound the SumCalculated event query below.
          START_BLOCK=$(cast block-number --rpc-url http://localhost:8545)

          NUM_TRIGGERS=3
          SUCCESSFUL=0

          for i in $(seq 1 $NUM_TRIGGERS); do
            echo "=== Triggering task $i of $NUM_TRIGGERS ==="
            # Use pre-built binary for speed
            if ./target/release/send_request; then
              echo "✅ Task $i completed successfully"
              SUCCESSFUL=$((SUCCESSFUL + 1))
            else
              echo "❌ Task $i failed"
              echo "=== Router logs ==="
              kubectl logs -l app.kubernetes.io/component=router --tail 100
              exit 1
            fi

            # Small delay between triggers
            if [ $i -lt $NUM_TRIGGERS ]; then
              echo "Waiting before next trigger..."
              sleep 2
            fi
          done

          # Verify stateTransitionCount increased
          FINAL_COUNT=$(cast call "$ARRAY_SUMMATION_ADDRESS" "stateTransitionCount()(uint256)" --rpc-url http://localhost:8545 | tr -d '[:space:]')
          echo "Final stateTransitionCount: $FINAL_COUNT"
          EXPECTED=$((INITIAL_COUNT + NUM_TRIGGERS))

          if [ "$FINAL_COUNT" -ge "$EXPECTED" ]; then
            echo "✅ stateTransitionCount increased correctly: $INITIAL_COUNT -> $FINAL_COUNT"
          else
            echo "❌ stateTransitionCount mismatch: expected at least $EXPECTED, got $FINAL_COUNT"
            exit 1
          fi

          # Count SumCalculated events emitted since the triggers began.
          EVENT_TOPIC=$(cast keccak 'SumCalculated(uint256,uint256)')
          EVENT_JSON=$(cast logs --from-block "$START_BLOCK" --address "$ARRAY_SUMMATION_ADDRESS" "$EVENT_TOPIC" --rpc-url http://localhost:8545 --json 2>/dev/null || echo '[]')
          EVENT_COUNT=$(echo "$EVENT_JSON" | jq 'length')
          echo "Found $EVENT_COUNT SumCalculated events"

          if [ "$EVENT_COUNT" -ge "$NUM_TRIGGERS" ]; then
            echo "✅ Expected number of events found: $EVENT_COUNT >= $NUM_TRIGGERS"
          else
            echo "⚠️ Fewer events than expected: $EVENT_COUNT < $NUM_TRIGGERS"
          fi

          echo "✅ All $SUCCESSFUL triggers completed successfully!"

      - name: Show router logs
        run: |
          echo "=== Router logs ==="
          kubectl logs -l app.kubernetes.io/component=router --tail 50

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== All Pods Status ==="
          kubectl get pods -o wide

          echo "=== Events (last 30) ==="
          kubectl get events --sort-by=.metadata.creationTimestamp | tail -30

          echo "=== Router Logs (current, last 200) ==="
          ROUTER_POD=$(kubectl get pods -l app.kubernetes.io/component=router -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$ROUTER_POD" ]; then
            echo "Restart count: $(kubectl get pod $ROUTER_POD -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null || echo unknown)"
            kubectl logs $ROUTER_POD --tail=200 || true
            echo ""
            echo "=== Router Logs (previous container, if crashed/restarted) ==="
            kubectl logs $ROUTER_POD --previous --tail=200 2>/dev/null || echo "No previous container logs available"
          fi

          echo "=== Node-1 Logs (last 100) ==="
          kubectl logs -l gas-killer/node-index=1 -c node --tail 100 || true

          echo "=== Node-2 Logs (last 100) ==="
          kubectl logs -l gas-killer/node-index=2 -c node --tail 100 || true

          echo "=== Node-3 Logs (last 100) ==="
          kubectl logs -l gas-killer/node-index=3 -c node --tail 100 || true

      - name: Cleanup
        if: always()
        run: |
          # Kill port forwarding
          pkill -f "port-forward" || true

          # Uninstall helm release
          helm uninstall gas-killer || true

          # Delete the kind cluster
          kind delete cluster --name gas-killer-test || true
