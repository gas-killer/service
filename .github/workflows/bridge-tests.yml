name: Bridge Tests

# The shard bridge is stdlib-only Python mounted into a plain python:3.12-slim pod,
# so it has no build step of its own and would otherwise go unchecked.
on:
  push:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-tests.yml"
  pull_request:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-tests.yml"

jobs:
  test:
    name: Bridge unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s bridge -v
