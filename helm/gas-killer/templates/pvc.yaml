apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gas-killer.shareddata.fullname" . }}
  {{- if .Values.sharedData.retainOnUninstall }}
  annotations:
    # Outlives `helm uninstall`. This volume holds the operator key files, which exist
    # nowhere else until the key-export job copies them to Secret Manager and cannot be
    # regenerated, since their addresses are registered on chain. Keeping the claim also
    # makes the PV's reclaim policy moot: it is never released, so `Delete` never fires.
    #
    # The volume then only goes away on an explicit `kubectl delete pvc`, and resizing it
    # means deleting it first.
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    {{- include "gas-killer.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.sharedData.accessMode }}
  {{- if .Values.sharedData.storageClass }}
  storageClassName: {{ .Values.sharedData.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sharedData.size }}
