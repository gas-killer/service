{{- $root := . -}}
{{- $nodeCount := int .Values.global.nodeCount -}}
{{- range $i := until $nodeCount }}
{{- $nodeIndex := add $i 1 }}
{{- $nodePort := add (int $root.Values.node.basePort) $i }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gas-killer.node.fullname" $root }}-{{ $nodeIndex }}
  labels:
    {{- include "gas-killer.labels" $root | nindent 4 }}
    app.kubernetes.io/component: node
    gas-killer/node-index: {{ $nodeIndex | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gas-killer.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: node
      gas-killer/node-index: {{ $nodeIndex | quote }}
  template:
    metadata:
      labels:
        {{- include "gas-killer.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: node
        gas-killer/node-index: {{ $nodeIndex | quote }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.node.terminationGracePeriodSeconds }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root.Values.secretManager.enabled }}
      serviceAccountName: {{ default (include "gas-killer.serviceaccount.fullname" $root) $root.Values.secretManager.serviceAccountName }}
      {{- end }}
      initContainers:
        {{- if and (eq $root.Values.global.environment "TESTNET") $root.Values.secretManager.enabled }}
        # Fetch BLS key, avs_deploy.json, and the router public key from GCP Secret Manager.
        # Workload Identity provides authentication — no static credentials needed.
        # Retries until the key-export job has populated all secrets.
        - name: fetch-secrets
          image: {{ $root.Values.secretManager.cloudSdkImage | quote }}
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              PROJECT="{{ required "secretManager.projectId is required when secretManager.enabled=true" $root.Values.secretManager.projectId }}"
              PREFIX="{{ $root.Values.secretManager.keyPrefix }}"
              TIMEOUT={{ $root.Values.global.initTimeout }}

              fetch_secret() {
                local name="$1" dest="$2"
                local elapsed=0
                echo "Fetching ${name} (timeout: ${TIMEOUT}s)..."
                until gcloud secrets versions access latest \
                  --secret="$name" --project="$PROJECT" > "$dest" 2>/dev/null; do
                  if [ "$elapsed" -ge "$TIMEOUT" ]; then
                    echo "ERROR: Timeout waiting for ${name} after ${TIMEOUT}s"
                    exit 1
                  fi
                  echo "Secret ${name} not available yet, retrying... (${elapsed}s elapsed)"
                  sleep 10
                  elapsed=$((elapsed + 10))
                done
                echo "Fetched ${name}"
              }

              fetch_secret "${PREFIX}-node-{{ $nodeIndex }}-bls-key" /app/secrets/bls-key.json
              fetch_secret "${PREFIX}-avs-deploy"                    /app/secrets/avs_deploy.json
              fetch_secret "${PREFIX}-router-public-key"             /app/secrets/public_orchestrator.json
              echo "All node secrets fetched successfully"
          volumeMounts:
            - name: node-secrets
              mountPath: /app/secrets
        {{- else }}
        # Wait for setup job to fully complete (check for .setup_complete marker)
        # This ensures operators are registered in the quorum before nodes start
        - name: wait-for-setup
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for setup to complete (timeout: {{ $root.Values.global.initTimeout }}s)..."
              KEY_FILE="/app/.nodes/operator_keys/testacc{{ $nodeIndex }}.private.bls.key.json"
              TIMEOUT={{ $root.Values.global.initTimeout }}
              ELAPSED=0
              until [ -f /app/.nodes/.setup_complete ] && [ -f "$KEY_FILE" ]; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "ERROR: Timeout waiting for setup to complete after ${TIMEOUT}s"
                  exit 1
                fi
                echo "Setup not complete, waiting for .setup_complete marker and $KEY_FILE... (${ELAPSED}s elapsed)"
                sleep 10
                ELAPSED=$((ELAPSED + 10))
              done
              echo "Setup complete! Key file found at $KEY_FILE"
          volumeMounts:
            - name: shared-data
              mountPath: /app/.nodes
              readOnly: true
        {{- end }}

        {{- if $root.Values.bridge.waitForBridge }}
        # Wait for bridge job to complete before starting the node
        # The bridge creates a .bridge_complete marker when done
        - name: wait-for-bridge
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for bridge to complete (timeout: {{ $root.Values.global.initTimeout }}s)..."
              TIMEOUT={{ $root.Values.global.initTimeout }}
              ELAPSED=0
              until [ -f /app/.nodes/.bridge_complete ]; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "ERROR: Timeout waiting for bridge to complete after ${TIMEOUT}s"
                  exit 1
                fi
                echo "Bridge not complete, waiting for .bridge_complete marker... (${ELAPSED}s elapsed)"
                sleep 10
                ELAPSED=$((ELAPSED + 10))
              done
              echo "Bridge complete!"
          volumeMounts:
            - name: shared-data
              mountPath: /app/.nodes
              readOnly: true
        {{- end }}

        {{- if eq $root.Values.global.environment "LOCAL" }}
        # Wait for L1 RPC to be accessible before starting the node (LOCAL mode only)
        - name: wait-for-l1
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for L1 RPC (timeout: {{ $root.Values.global.initTimeout }}s)..."
              TIMEOUT={{ $root.Values.global.initTimeout }}
              ELAPSED=0
              until nc -z {{ include "gas-killer.l1.fullname" $root }} {{ $root.Values.l1.service.port }}; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "ERROR: Timeout waiting for L1 RPC after ${TIMEOUT}s"
                  exit 1
                fi
                echo "L1 not ready, waiting... (${ELAPSED}s elapsed)"
                sleep 5
                ELAPSED=$((ELAPSED + 5))
              done
              echo "L1 is ready!"
        {{- end }}

        {{- if dig "enabled" false ($root.Values.overlay | default dict) }}
        # Download the pinned overlay artifacts (model weights + tokenizer) into
        # an emptyDir — the primary model at the root, each extra model
        # (multi-overlay) in its own subdirectory. Integrity is enforced by the
        # service itself: at startup / first mount it recomputes each manifest
        # from the blobs and refuses to serve on a mismatch with the pinned
        # GK_OVERLAY_MANIFEST[_N], so a corrupted download cannot be mounted.
        - name: fetch-overlay-artifacts
          image: {{ $root.Values.overlay.downloaderImage | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              BASE="{{ $root.Values.overlay.artifactBaseUrl }}"
              for f in "{{ $root.Values.overlay.weightsFile }}" "{{ $root.Values.overlay.tokenizerFile }}"; do
                echo "Downloading ${BASE}/${f}..."
                curl -fSL --retry 5 --retry-delay 10 -o "/overlay/${f}" "${BASE}/${f}"
              done
              {{- range $model := ($root.Values.overlay.extraModels | default list) }}
              mkdir -p "/overlay/{{ $model.name }}"
              for f in "{{ $model.weightsFile | default "weights.bin" }}" "{{ $model.tokenizerFile | default "tokenizer.bin" }}"; do
                echo "Downloading {{ $model.artifactBaseUrl }}/${f} (extra model {{ $model.name }})..."
                curl -fSL --retry 5 --retry-delay 10 -o "/overlay/{{ $model.name }}/${f}" "{{ $model.artifactBaseUrl }}/${f}"
              done
              {{- end }}
              echo "Overlay artifacts downloaded."
          volumeMounts:
            - name: overlay-artifacts
              mountPath: /overlay
        {{- end }}

        {{- $delayPerNode := int $root.Values.node.startupDelaySecsPerNode }}
        {{- $nodeDelay := mul $i $delayPerNode }}
        {{- if gt $nodeDelay 0 }}
        # Stagger EigenSDK eth_getLogs backfill: node-{{ $nodeIndex }} waits {{ $nodeDelay }}s so at most
        # one process runs its operator-state sweep at a time. Remove once service#275 is merged.
        - name: startup-delay
          image: busybox:1.36
          command:
            - sh
            - -c
            - "echo 'Delaying startup by {{ $nodeDelay }}s (node {{ $nodeIndex }})...'; sleep {{ $nodeDelay }}; echo 'Done.'"
        {{- end }}

      containers:
        - name: node
          image: "{{ $root.Values.node.image.repository }}:{{ required "node.image.tag must be set" $root.Values.node.image.tag }}"
          imagePullPolicy: {{ $root.Values.node.image.pullPolicy }}
          args:
            - "--key-file"
            {{- if and (eq $root.Values.global.environment "TESTNET") $root.Values.secretManager.enabled }}
            - "/app/secrets/bls-key.json"
            {{- else }}
            - "/app/.nodes/operator_keys/testacc{{ $nodeIndex }}.private.bls.key.json"
            {{- end }}
            - "--port"
            - {{ $nodePort | quote }}
            - "--orchestrator"
            {{- if and (eq $root.Values.global.environment "TESTNET") $root.Values.secretManager.enabled }}
            # Fetched from GCP Secret Manager by the fetch-secrets init container
            - "/app/secrets/public_orchestrator.json"
            {{- else if $root.Values.orchestrator.publicConfig }}
            # Mounted from configmap (LOCAL mode or TESTNET without secretManager)
            - "/app/public_orchestrator.json"
            {{- else }}
            {{- fail "orchestrator.publicConfig must be set (or secretManager.enabled=true for TESTNET)" }}
            {{- end }}
          env:
            {{- if eq $root.Values.global.environment "TESTNET" }}
            # TESTNET mode (no L2): Use external RPC from secret
            - name: HTTP_RPC
              valueFrom:
                secretKeyRef:
                  name: {{ include "gas-killer.secret.fullname" $root }}
                  key: HTTP_RPC
            - name: WS_RPC
              valueFrom:
                secretKeyRef:
                  name: {{ include "gas-killer.secret.fullname" $root }}
                  key: WS_RPC
            {{- else }}
            # LOCAL mode: Use local L1 Anvil service
            - name: HTTP_RPC
              value: "http://{{ include "gas-killer.l1.fullname" $root }}:{{ $root.Values.l1.service.port }}"
            - name: WS_RPC
              value: "ws://{{ include "gas-killer.l1.fullname" $root }}:{{ $root.Values.l1.service.port }}"
            {{- end }}
            {{- if $root.Values.l2.enabled }}
            {{- if eq $root.Values.global.environment "LOCAL" }}
            - name: L2_HTTP_RPC
              value: "http://{{ include "gas-killer.l2.fullname" $root }}:{{ $root.Values.l2.service.port }}"
            {{- else if eq $root.Values.global.environment "TESTNET" }}
            - name: L2_HTTP_RPC
              valueFrom:
                secretKeyRef:
                  name: {{ include "gas-killer.secret.fullname" $root }}
                  key: L2_HTTP_RPC
            {{- end }}
            {{- end }}
            - name: RUST_BACKTRACE
              value: "1"
            # Simulation profile for tracked-function analysis. Router and all nodes
            # derive this from the same global value so their signed payloads agree.
            - name: GK_SIM_PROFILE
              value: {{ include "gas-killer.simProfile" $root | quote }}
            # Executor selection (gas-analyzer#169): "rpc" simulates via
            # debug_traceCall (historical path); "local" executes in-process
            # inside gas-analyzer, reducing the simulation RPC to a lazy state
            # backend. Router and all nodes derive this from the same global
            # value, same discipline as GK_SIM_PROFILE.
            - name: GK_SIM_EXECUTOR
              value: {{ include "gas-killer.simExecutor" $root | quote }}
            {{- if not (kindIs "invalid" $root.Values.global.overlayMmap) }}
            # Prefer the mmap-backed overlay source over the in-RAM one (only
            # meaningful under GK_SIM_EXECUTOR=local + overlay.enabled). Omitted
            # by default so the binary's own default applies (true under local).
            - name: GK_OVERLAY_MMAP
              value: {{ $root.Values.global.overlayMmap | toString | quote }}
            {{- end }}
            {{- if $root.Values.global.simRpc }}
            # Dedicated simulation endpoint (GK_SIM_RPC): tracked-function analysis
            # traces against this node (e.g. an anvil fork with pinned code overlays
            # setCode'd in) while HTTP_RPC stays on the real chain for settlement.
            # Shared by router and all nodes — a divergent sim endpoint diverges
            # signed payloads, same discipline as GK_SIM_PROFILE.
            - name: GK_SIM_RPC
              value: {{ $root.Values.global.simRpc | quote }}
            {{- end }}
            {{- if dig "enabled" false ($root.Values.overlay | default dict) }}
            # Pinned code overlay (UNBOUNDED_V2): blobs downloaded by the
            # fetch-overlay-artifacts initContainer, verified against the manifest
            # at startup, mounted as debug_traceCall state overrides. Pinned-env
            # config shared by router and all nodes, like GK_SIM_PROFILE.
            - name: GK_OVERLAY_WEIGHTS
              value: "{{ $root.Values.overlay.mountPath }}/{{ $root.Values.overlay.weightsFile }}"
            - name: GK_OVERLAY_TOKENIZER
              value: "{{ $root.Values.overlay.mountPath }}/{{ $root.Values.overlay.tokenizerFile }}"
            - name: GK_OVERLAY_MANIFEST
              value: {{ $root.Values.overlay.manifest | quote }}
            {{- range $mi, $model := ($root.Values.overlay.extraModels | default list) }}
            # Extra pinned model "{{ $model.name }}" (multi-overlay slot {{ add $mi 2 }}):
            # mounted simultaneously with the primary model — per-manifest
            # derived chunk addresses keep the models' address sets disjoint.
            - name: GK_OVERLAY_WEIGHTS_{{ add $mi 2 }}
              value: "{{ $root.Values.overlay.mountPath }}/{{ $model.name }}/{{ $model.weightsFile | default "weights.bin" }}"
            - name: GK_OVERLAY_TOKENIZER_{{ add $mi 2 }}
              value: "{{ $root.Values.overlay.mountPath }}/{{ $model.name }}/{{ $model.tokenizerFile | default "tokenizer.bin" }}"
            - name: GK_OVERLAY_MANIFEST_{{ add $mi 2 }}
              value: {{ $model.manifest | quote }}
            {{- end }}
            {{- end }}
            - name: AVS_DEPLOYMENT_PATH
              {{- if and (eq $root.Values.global.environment "TESTNET") $root.Values.secretManager.enabled }}
              value: "/app/secrets/avs_deploy.json"
              {{- else }}
              value: "/app/.nodes/avs_deploy.json"
              {{- end }}
            {{- if dig "prewarm" "enabled" false ($root.Values.global | default dict) }}
            # Prewarm feed: the router publishes every ingress-accepted task on its
            # internal health port; the node polls it and starts simulating at
            # ingress time so the round broadcast hits a warm digest cache.
            - name: GK_PREWARM_URL
              value: "http://{{ include "gas-killer.router.fullname" $root }}:{{ $root.Values.router.healthzPort }}/prewarm"
            {{- end }}
            - name: HEALTHZ_PORT
              value: {{ $root.Values.node.healthzPort | quote }}
            - name: P2P_MESSAGE_BACKLOG
              value: {{ $root.Values.node.p2pMessageBacklog | quote }}
            - name: P2P_MESSAGES_PER_SECOND
              value: {{ $root.Values.node.p2pMessagesPerSecond | quote }}
          ports:
            - name: node
              containerPort: {{ $nodePort }}
              protocol: TCP
            - name: healthz
              containerPort: {{ $root.Values.node.healthzPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            # The CPU-bound gas-analysis trace is offloaded to Tokio's blocking
            # pool (see common/src/validator.rs analyze_transaction) so it no
            # longer monopolizes the async worker pool /healthz runs on, even
            # during a multi-minute GK_SIM_EXECUTOR=local trace. These settings
            # are sane defaults for that workload: timeoutSeconds is generous enough
            # to absorb scheduling jitter under load, and periodSeconds/failureThreshold
            # give a genuinely hung pod ~3 minutes to prove itself dead before Kubernetes
            # kills it, rather than the previous 15s*4=60s window that fired mid-analysis.
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: shared-data
              mountPath: /app/.nodes
              readOnly: true
            {{- if dig "enabled" false ($root.Values.overlay | default dict) }}
            - name: overlay-artifacts
              mountPath: {{ $root.Values.overlay.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and (eq $root.Values.global.environment "TESTNET") $root.Values.secretManager.enabled }}
            - name: node-secrets
              mountPath: /app/secrets
              readOnly: true
            {{- end }}
            {{- if and $root.Values.orchestrator.publicConfig (not (and (eq $root.Values.global.environment "TESTNET") $root.Values.secretManager.enabled)) }}
            - name: config
              mountPath: /app/public_orchestrator.json
              subPath: public_orchestrator.json
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $root.Values.node.resources | nindent 12 }}

      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ include "gas-killer.shareddata.fullname" $root }}
        {{- if dig "enabled" false ($root.Values.overlay | default dict) }}
        - name: overlay-artifacts
          emptyDir: {}
        {{- end }}
        {{- if and (eq $root.Values.global.environment "TESTNET") $root.Values.secretManager.enabled }}
        - name: node-secrets
          emptyDir: {}
        {{- end }}
        {{- if and $root.Values.orchestrator.publicConfig (not (and (eq $root.Values.global.environment "TESTNET") $root.Values.secretManager.enabled)) }}
        - name: config
          configMap:
            name: {{ include "gas-killer.config.fullname" $root }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gas-killer.node.fullname" $root }}-{{ $nodeIndex }}
  labels:
    {{- include "gas-killer.labels" $root | nindent 4 }}
    app.kubernetes.io/component: node
    gas-killer/node-index: {{ $nodeIndex | quote }}
spec:
  type: ClusterIP
  # CRITICAL: Allow traffic to pods before they pass readiness probes
  # This is required because nodes need to dial each other during P2P startup
  # Without this, services have no endpoints until pods are ready, creating a deadlock
  publishNotReadyAddresses: true
  ports:
    - port: {{ $nodePort }}
      targetPort: node
      protocol: TCP
      name: node
    - port: {{ $root.Values.node.healthzPort }}
      targetPort: healthz
      protocol: TCP
      name: metrics
  selector:
    {{- include "gas-killer.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: node
    gas-killer/node-index: {{ $nodeIndex | quote }}
{{- end }}
