# Stable testnet configuration. Pass on every testnet upgrade.
#
# Usage:
#   helm upgrade --install gas-killer ./helm/gas-killer \
#     -f helm/gas-killer/testnet-overrides.yaml \
#     --set secrets.privateKey=0x... \
#     --set secrets.fundedKey=0x... \
#     --set secrets.httpRpc=https://... \
#     --set secrets.l2HttpRpc=https://... \
#     --set secrets.adminKey=<admin-key> \
#     --set l2.enabled=true \
#     --set router.image.tag=router-<sha> \
#     --set node.image.tag=node-<sha> \
#     --set kube-prometheus-stack.grafana.adminPassword=<password> \
#     --wait --timeout 15m
#
# --wait holds the release open until every workload is ready, and fails it otherwise. The
# apiserver accepts a Deployment whose pods it then refuses — a priority class the namespace
# cannot use, a pool with no room for the fork's 2-4 CPU — and that error stops at the
# ReplicaSet's events, while the same upgrade has already pointed the router and every node at
# the endpoint behind it.
#
# The cost is upgrade time: setup, deploy-target and schnorr-operators carry
# ttlSecondsAfterFinished, so they re-run on every upgrade and the release waits for all three.
# A Job that dies on a transient RPC error fails the release with the fleet healthy. 15m covers
# them plus global.initTimeout. --atomic would additionally roll a fleet-wide profile flip back
# on its own, stranding whatever rounds were in flight.

global:
  environment: TESTNET

  # Heavy-compute tracked functions are only extractable from the net diff; a struct-log
  # trace of a call that expensive does not complete. The fleet shares one RPC serving
  # prestateTracer (diffMode) and callTracer (withLog), meeting the single-client
  # condition on the stateEncoding block in values.yaml.
  stateEncoding: "prestate-net"

  # What this testnet exists to run: tracked functions whose direct execution exceeds a block.
  # The profile changes the derived storage_updates and therefore the task digest, so the router
  # and every node take it from one value and flip together — a partially migrated fleet fails
  # quorum until it converges. Truthful only against a simulation endpoint whose execution cap is
  # lifted, which is what simRpc.url below points at. `--set global.simProfile=chain` reverts it.
  simProfile: unbounded

# The fleet's simulation endpoint (SIM_HTTP_RPC on the router and every node): the in-cluster
# Sepolia reth from helm/sim-node, started with --rpc.gascap=max. Extraction and the EVMSketch gas
# estimate go here; settlement, chain detection and stateTransitionCount stay on secrets.httpRpc,
# so this node never sees a transaction. A hosted provider will not do: it clamps debug_traceCall
# silently, and a clamped trace is indistinguishable from a real one downstream.
#
# Mutually exclusive with l1.simFork.enabled (the bundled anvil fork), which is the small-target
# fallback: it refetches state from upstream on every re-fork, which never converges for a target
# reading a 24k-chunk weight directory. Falling back is --set simRpc.url= --set
# l1.simFork.enabled=true, and the node can stay up.
simRpc:
  url: http://sim-node:8545

imagePullSecrets:
  - name: ghcr-pull-secret

secretManager:
  enabled: true
  projectId: gas-killer-testnet
  keyPrefix: gas-killer-testnet
  gcpServiceAccount: gas-killer-app@gas-killer-testnet.iam.gserviceaccount.com

eigenlayer:
  contracts:
    delegationManager: "0xD4A7E1Bd8015057293f0D0A557088c286942e84b"
    strategyManager: "0x2E3D6c0744b10eb0A4e6F679F71554a39Ec47a5D"
    lstContract: "0x00c71b0fcadE911B2feeE9912De4Fe19eB04ca56"
    lstStrategy: "0x8b29d91e67b013e855EaFe0ad704aC4Ab086a574"
    allocationManager: "0x42583067658071247ec8CE0A516A58f682002d07"
  quorum:
    minimumStake: "100000000000000000"   # 0.1 stETH
    maxOperatorCount: 4
    kickBIPsOfOperatorStake: 10000
    kickBIPsOfTotalStake: 100
  sdk:
    quorumThreshold: "2"
    thresholdDenominator: "3"
    blockStaleMeasure: "300"

ingress:
  enabled: true
  host: testnet.gaskiller.xyz
  annotations:
    # testnet.gaskiller.xyz is proxied through Cloudflare, which terminates TLS and
    # forwards to the origin over HTTP. nginx would answer that with a 308 to HTTPS,
    # which Cloudflare serves back to the client as a redirect to the same URL — an
    # infinite loop. grafana-testnet.gaskiller.xyz is DNS-only and reaches the origin
    # over HTTPS, so it is unaffected.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

monitoring:
  enabled: true
  grafana:
    ingress:
      enabled: true
      host: grafana-testnet.gaskiller.xyz

router:
  # A tracked call under `unbounded` is traced by the router and then again by every node, in
  # series, at roughly 0.2 Ggas/s on the sim node — a round for a call of that size spans tens of
  # minutes rather than the seconds an ordinary task takes. Ordinary tasks are unaffected; the
  # cost is that a round which never reaches quorum blocks the queue for the full window.
  #
  # eigenlayer.sdk.blockStaleMeasure does not cap this window. It bounds referenceBlockNumber,
  # which verifyAndUpdate takes and the router picks fresh at submit time (current block - 1), so
  # the block_height an analysis is anchored at never reaches the contract. What a long round
  # risks instead is the pinned transitionIndex no longer matching stateTransitionCount() when the
  # payload settles, which tracks how busy the target is rather than any block budget. Stays below
  # ingress.taskTtlSeconds, which bounds how long a task queued behind this round survives.
  roundTimeout: "2400"
  # Blocks a rendered payload stays valid, sized so a payload outlives the round that produced it.
  # Coupled to admission: ingress.stalenessWindowBlocks derives as blockStaleMeasure -
  # payloadBlockBuffer, so at 250 the accepted anchor window is 50 blocks and a task anchored more
  # than ~10 min back is refused with 400 STALE_BLOCK.
  payloadBlockBuffer: "250"
  ingress:
    timeoutMs: "0"
    # Equal to the payload's own validity window (payloadBlockBuffer x 12s), so a task can never
    # reach `ready` holding a payload the contract will no longer accept — it expires as a task
    # first. Long enough for a multi-minute round plus its wait in the queue, and above
    # router.roundTimeout, which a queued task has to outlive to be reached at all.
    taskTtlSeconds: "3000"

# The bridge mirrors EigenLayer operator state from L1 to L2, so it has nothing to do
# on an L1-only testnet: bridge-to-l2.sh exits non-zero without an L2 RPC. Both keys
# must move together — waitForBridge is read independently of enabled, so disabling
# only the job leaves every node and the router waiting 300s for a .bridge_complete
# marker that nothing writes, then failing their init container. Set both back to true
# alongside l2.enabled=true and secrets.l2HttpRpc.
bridge:
  enabled: false
  waitForBridge: false

# Deploy the smoke-test target (ArraySummation) wired to a real BLSSignatureChecker after
# AVS setup, then publish its address to a ConfigMap. Read it for the local smoke test:
#   kubectl get configmap gas-killer-smoke-target -o jsonpath='{.data.target}'
deployTarget:
  enabled: true
  image:
    # `latest` is published on pushes to main (solidity-sdk docker-publish workflow).
    # Pin with --set deployTarget.image.tag=<sha> if you need a specific build.
    tag: latest
  configMapName: gas-killer-smoke-target
  # ArraySummation params (smoke test sums indexes [1,2,3], so arraySize must be >= 4).
  arraySize: 10
  maxValue: 10000
  arraySeed: 1

# Provision the SchnorrStakeRegistry while the fleet keeps signing BLS, so the router publishes its
# address as `schnorrStakeRegistry` on GET /avs-metadata and an integrator can wire a target that
# accepts both schemes ahead of the cutover.
#
# `registry` rather than `full`: this deployment's operator secp256k1 keys are gone, so nobody can
# be registered. The registry verifies nothing until it is filled, which only matters once a fleet
# signs schnorr. The schnorr install that registers a new operator set fills it through
# schnorr-operators, since the job registers into a pinned registry while it is empty, so the
# address does not change.
schnorr:
  provision: registry

  # Fixed at registry deployment, immutable afterwards. Sized against the longest window a
  # settlement can span: eigenlayer.sdk.blockStaleMeasure (300 blocks) plus router.roundTimeout
  # (300s, ~25 blocks at a 12s slot) gives a 325-block floor, so 600 leaves ~1.85x margin.
  #
  # Deliberately not the chart's default of 0. At 0 even announceRegister is committable in the
  # same block, so the announce path would give no protection at all. The window costs nothing at
  # the cutover itself: the operator set is registered through the immediate path while the fleet
  # still signs BLS, so no schnorr round exists to invalidate. What it protects is operator churn
  # afterwards, against a live schnorr fleet.
  noticeWindow: 600

  # Deployed 2026-09-10, owner 0x5DD2e7db868e33c03daB85d0C623048A7980634E, threshold 2/3, no
  # operator registered. Pinning it here is what makes the address durable: a PVC rebuilt and
  # restored without addresses.schnorrStakeRegistry in avs_deploy.json would otherwise let
  # rerun.schnorrOperators deploy a FRESH registry, orphaning every target wired to this one.
  #
  # Changing this value strands every integrator target whose constructor took the old address, so
  # it moves only alongside a coordinated migration.
  stakeRegistryAddress: "0x8A86301675ac9617895117afFE9577f5154555F9"
