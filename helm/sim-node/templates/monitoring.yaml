{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sim-node.name" . }}
  labels:
    {{- include "sim-node.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sim-node.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: 30s
{{- /* At replicas=0 (snapshot restore) the downtime is deliberate and absent() would page for it. */}}
{{- if gt (int .Values.replicas) 0 }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "sim-node.name" . }}
  labels:
    {{- include "sim-node.labels" . | nindent 4 }}
    {{- toYaml .Values.monitoring.ruleLabels | nindent 4 }}
spec:
  groups:
    - name: sim-node
      interval: 30s
      rules:
        # No single series moves through every phase: stage checkpoints commit only per large batch
        # (flat for the whole Execution stage), the download counters move only in Headers/Bodies,
        # executed blocks only in Execution, the canonical height only once live. Stalled means
        # none of them changed. label_replace keeps the series distinct once changes() drops names.
        - alert: SimNodeHeadStalled
          expr: |
            sum by (pod) (changes(label_replace(
              {job="{{ include "sim-node.name" . }}-headless", __name__=~"reth_sync_checkpoint|reth_sync_entities_processed|reth_sync_execution_execution_histogram_count|reth_downloaders_(headers|bodies)_total_downloaded|reth_blockchain_tree_canonical_chain_height"},
              "metric", "$1", "__name__", "(.+)"
            )[{{ .Values.monitoring.headStalledWindow }}:30s])) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "sim-node {{ "{{" }} $labels.pod {{ "}}" }} head has stopped advancing"
            description: "reth has made no sync or import progress in {{ .Values.monitoring.headStalledWindow }}, so the fleet is simulating against stale state. Check both clients' logs; a client that predates a scheduled hard fork stalls at the fork block."

        - alert: SimNodeMetricsDown
          expr: up{job="{{ include "sim-node.name" . }}-headless"} == 0 or absent(up{job="{{ include "sim-node.name" . }}-headless"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "sim-node metrics are unreachable"
            description: "Prometheus cannot scrape reth, so SimNodeHeadStalled cannot fire."

        - alert: SimNodeCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace="{{ .Release.Namespace }}",
              pod=~"{{ include "sim-node.name" . }}-[0-9]+"
            }[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "sim-node {{ "{{" }} $labels.pod {{ "}}" }}/{{ "{{" }} $labels.container {{ "}}" }} is crash-looping"
            description: "The container has restarted in the last 15 minutes."
{{- end }}
{{- end }}
